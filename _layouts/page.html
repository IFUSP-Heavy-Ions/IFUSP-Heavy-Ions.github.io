---
layout: default
---
<header class="page-hero">
  <div class="container">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
<div class="container page-body{% if page.wide %} page-body-wide{% endif %}">
  {{ content }}
</div>
