# Members of the IFUSP Heavy-Ion Group
#
# List everyone under their real role (Postdocs, PhD Students, etc.).
# Set active: false when they leave — the website will move them to the
# "Former Members" section automatically. No need to change their role.
#
# inspire_bai: INSPIRE-HEP author BAI (e.g. "M.Luzum.1")
#   Used by scripts/update_publications_from_inspirehep.py
#   Look up at: https://inspirehep.net/authors
# lattes: CNPq Lattes curriculum ID number (16 digits)
# orcid: ORCID identifier
# url: personal or profile page URL
# note: short note shown for former members (e.g. current position)

