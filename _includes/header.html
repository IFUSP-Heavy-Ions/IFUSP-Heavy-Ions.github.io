<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include logo.html id="header" %}
      <span class="brand-text">
        <span class="brand-name">IFUSP Heavy Ions</span>
        <span class="brand-sub">University of São Paulo</span>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="sr-only">Menu</span>
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Main">
      {%- for item in site.data.navigation -%}
        {%- assign current = false -%}
        {%- if page.url == item.url -%}{%- assign current = true -%}{%- endif -%}
        <a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
      <a class="nav-github" href="https://github.com/{{ site.github_org }}" target="_blank" rel="noopener" aria-label="GitHub organization">
        {% include icon.html name="github" %}<span class="nav-github-label">GitHub</span>
      </a>
    </nav>
  </div>
</header>
