{%- comment -%}
  Static heavy-ion event display & anisotropic flow harmonic contour illustration
  for the home hero banner. Shown when hero mode is "static".
{%- endcomment -%}
<svg class="hero-static-svg" viewBox="0 0 800 540" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="qgp-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.92"/>
      <stop offset="26%" stop-color="#38bdf8" stop-opacity="0.62"/>
      <stop offset="58%" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#07101f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="qgp-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07101f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="track-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(565, 252)">
    <!-- Outer ambient glow -->
    <circle r="310" fill="url(#qgp-halo)"/>

    <!-- Detector TPC concentric rings & azimuthal sector lines -->
    <g stroke="#93c5fd" stroke-opacity="0.13" fill="none" stroke-width="1">
      <circle r="68"/>
      <circle r="115"/>
      <circle r="168" stroke-dasharray="3 5" stroke-opacity="0.2"/>
      <circle r="224"/>
      <circle r="285"/>
      <line x1="-320" y1="0" x2="320" y2="0" stroke-dasharray="2 6"/>
      <line x1="0" y1="-300" x2="0" y2="300" stroke-dasharray="2 6"/>
      <line x1="-220" y1="-220" x2="220" y2="220" stroke-opacity="0.07"/>
      <line x1="-220" y1="220" x2="220" y2="-220" stroke-opacity="0.07"/>
    </g>

    <!-- Anisotropic hydrodynamic isotherms (v2 elliptic + v3 triangular modulation) -->
    <!-- Outer freeze-out surface contour -->
    <path d="M 0,-148 C 48,-144 92,-95 106,-42 C 118,5 108,65 78,108 C 48,148 -28,158 -68,124 C -108,88 -122,25 -108,-35 C -94,-95 -48,-152 0,-148 Z"
          fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Intermediate hydrodynamic contour (v2 + v3) -->
    <path d="M 0,-112 C 36,-110 70,-72 80,-30 C 89,8 80,52 56,84 C 32,115 -22,120 -52,92 C -82,65 -90,18 -80,-26 C -70,-72 -36,-114 0,-112 Z"
          fill="none" stroke="#60a5fa" stroke-opacity="0.48" stroke-width="1.6"/>

    <!-- Inner high-temperature QGP contour (gold/amber highlight) -->
    <path d="M 0,-76 C 24,-74 48,-48 54,-18 C 60,8 52,36 36,58 C 20,78 -16,80 -36,62 C -56,42 -60,12 -54,-16 C -48,-48 -24,-78 0,-76 Z"
          fill="none" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1.6"/>

    <!-- Glowing QGP fireball core -->
    <ellipse rx="74" ry="104" transform="rotate(-6)" fill="url(#qgp-core)"/>

    <!-- Curved charged-particle tracks in a magnetic field -->
    <g fill="none" stroke-linecap="round">
      <!-- Cyan tracks -->
      <path d="M 0,0 Q 55,-28 155,-118" stroke="url(#track-cyan)" stroke-width="1.7"/>
      <path d="M 0,0 Q 75,-5 215,32" stroke="url(#track-cyan)" stroke-width="1.4"/>
      <path d="M 0,0 Q 42,58 118,175" stroke="url(#track-cyan)" stroke-width="1.6"/>
      <path d="M 0,0 Q 15,78 -24,210" stroke="url(#track-cyan)" stroke-width="1.3"/>
      <path d="M 0,0 Q -52,48 -168,125" stroke="url(#track-cyan)" stroke-width="1.7"/>
      <path d="M 0,0 Q -78,-12 -215,-58" stroke="url(#track-cyan)" stroke-width="1.5"/>
      <path d="M 0,0 Q -38,-68 -125,-185" stroke="url(#track-cyan)" stroke-width="1.6"/>
      <path d="M 0,0 Q 12,-85 52,-215" stroke="url(#track-cyan)" stroke-width="1.4"/>
      <path d="M 0,0 Q 82,-48 228,-62" stroke="url(#track-cyan)" stroke-width="1.2"/>
      <path d="M 0,0 Q -65,22 -196,46" stroke="url(#track-cyan)" stroke-width="1.3"/>

      <!-- Gold high-pT tracks -->
      <path d="M 0,0 Q 68,-52 195,-152" stroke="url(#track-gold)" stroke-width="2.1"/>
      <path d="M 0,0 Q 64,34 190,112" stroke="url(#track-gold)" stroke-width="1.9"/>
      <path d="M 0,0 Q -62,56 -175,165" stroke="url(#track-gold)" stroke-width="2.0"/>
      <path d="M 0,0 Q -68,-38 -195,-122" stroke="url(#track-gold)" stroke-width="2.1"/>
      <path d="M 0,0 Q -14,-74 -48,-205" stroke="url(#track-gold)" stroke-width="1.6"/>
      <path d="M 0,0 Q 22,74 62,202" stroke="url(#track-gold)" stroke-width="1.6"/>
    </g>

    <!-- Detector hit markers along the rings -->
    <g fill="#fef3c7" fill-opacity="0.85">
      <circle cx="88" cy="-76" r="2.3"/>
      <circle cx="145" cy="-114" r="2"/>
      <circle cx="98" cy="59" r="2.3"/>
      <circle cx="-88" cy="76" r="2.3"/>
      <circle cx="-102" cy="-54" r="2.3"/>
      <circle cx="-156" cy="-98" r="2"/>
    </g>
    <g fill="#38bdf8" fill-opacity="0.85">
      <circle cx="62" cy="-31" r="2"/>
      <circle cx="114" cy="11" r="2"/>
      <circle cx="52" cy="79" r="2"/>
      <circle cx="-12" cy="114" r="2"/>
      <circle cx="-94" cy="68" r="2"/>
      <circle cx="-111" cy="-24" r="2"/>
      <circle cx="-55" cy="-99" r="2"/>
      <circle cx="24" cy="-112" r="2"/>
    </g>
  </g>
</svg>
